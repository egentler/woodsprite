<dialog class="lightbox" id="lightbox" aria-label="Full-size jewelry photograph">
  <div class="lightbox-shell">
    <div class="lightbox-top"><span class="lightbox-wordmark">WoodSprite</span><span class="lightbox-count" id="lightbox-count"></span><button type="button" class="lightbox-close" aria-label="Close photograph">×</button></div>
    <div class="lightbox-stage">
      <button type="button" class="lightbox-arrow lightbox-prev" aria-label="Previous photograph">‹</button>
      <img id="lightbox-image" src="" alt="" />
      <button type="button" class="lightbox-arrow lightbox-next" aria-label="Next photograph">›</button>
    </div>
    <div class="lightbox-bottom"><div><p id="lightbox-title" class="lightbox-title"></p><p id="lightbox-description" class="lightbox-description"></p></div><a id="lightbox-shop" class="lightbox-shop" hidden target="_blank" rel="noopener noreferrer">View this piece ↗</a></div>
  </div>
</dialog>
